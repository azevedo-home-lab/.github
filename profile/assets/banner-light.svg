      <stop offset="0" stop-color="#c1121f" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#c1121f" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#c1121f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="#ffffff"/>

  <!-- star field -->
  <g fill="#0d1117">
    <circle cx="96"   cy="52"  r="1.1" opacity="0.4"/>
    <circle cx="212"  cy="148" r="0.7" opacity="0.25"/>
    <circle cx="308"  cy="66"  r="0.9" opacity="0.35"/>
    <circle cx="164"  cy="266" r="0.6" opacity="0.2"/>
    <circle cx="388"  cy="204" r="0.8" opacity="0.3"/>
    <circle cx="452"  cy="96"  r="0.6" opacity="0.2"/>
    <circle cx="530"  cy="308" r="0.7" opacity="0.25"/>
    <circle cx="748"  cy="84"  r="1.0" opacity="0.4"/>
    <circle cx="836"  cy="188" r="0.6" opacity="0.2"/>
    <circle cx="918"  cy="60"  r="0.8" opacity="0.3"/>
    <circle cx="1004" cy="252" r="0.7" opacity="0.25"/>
    <circle cx="1096" cy="140" r="0.9" opacity="0.35"/>
    <circle cx="1176" cy="300" r="0.6" opacity="0.2"/>
    <circle cx="1236" cy="176" r="0.8" opacity="0.3"/>
    <circle cx="64"   cy="352" r="0.7" opacity="0.25"/>
    <circle cx="702"  cy="342" r="0.6" opacity="0.2"/>
    <circle cx="560"  cy="40"  r="0.7" opacity="0.25"/>
    <circle cx="1140" cy="368" r="0.7" opacity="0.2"/>
  </g>

  <!-- monolith: 1 x 4 x 9 proportions, slightly above vertical center -->
  <rect x="604" y="56" width="72" height="162" fill="#0d1117"/>

  <!-- red lens -->
  <g>
    <circle cx="1198" cy="66" r="34" fill="url(#lensGlow)"/>
    <circle cx="1198" cy="66" r="16" fill="none" stroke="#c1121f" stroke-width="1" stroke-opacity="0.55"/>
    <circle cx="1198" cy="66" r="9"  fill="none" stroke="#c1121f" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="1198" cy="66" r="3.5" fill="#c1121f"/>
  </g>

  <!-- title card -->
  <text x="640" y="292" text-anchor="middle" fill="#0d1117"
        font-family="Futura, 'Century Gothic', 'URW Gothic', sans-serif"
        font-size="34" letter-spacing="14" font-weight="500">AZEVEDO-HOME-LAB</text>
  <text x="640" y="334" text-anchor="middle" fill="#57606a"
        font-family="Futura, 'Century Gothic', 'URW Gothic', sans-serif"
        font-size="13" letter-spacing="7">PERSONAL INFRASTRUCTURE - AUTOMATION - LORA</text>
</svg>
