    <rect x="671" y="299" width="30" height="1" opacity="0.25"/>
    <rect x="763" y="299" width="30" height="1" opacity="0.25"/>
    <rect x="854" y="299" width="30" height="1" opacity="0.25"/>
    <rect x="946" y="275" width="30" height="25"/>
    <rect x="1038" y="239" width="30" height="61"/>
    <rect x="1129" y="180" width="30" height="120"/>
