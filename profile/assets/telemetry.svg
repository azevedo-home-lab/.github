    <text x="790" y="122" fill="#8b949e" font-size="10" letter-spacing="4">OPEN BUGS</text>
    <text x="1090" y="98" fill="#c1121f" font-size="46">8</text>
    <text x="1090" y="122" fill="#c1121f" font-size="10" letter-spacing="4">DEPENDABOT ALERTS</text>
  </g>

  <line x1="90" y1="148" x2="1190" y2="148" stroke="#30363d" stroke-width="1"/>
  <text x="90" y="172" fill="#8b949e" font-family="Futura, 'Century Gothic', 'URW Gothic', sans-serif" font-size="10" letter-spacing="3">COMMITS PER WEEK</text>

  <!-- bars: weeks of 2026-05-17 .. 2026-08-02, values 7 16 11 0 0 4 0 0 0 42 100 198 -->
