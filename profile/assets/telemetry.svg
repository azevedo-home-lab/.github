<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Org telemetry: 378 commits in 12 weeks, 19 open pull requests, 9 open bugs, 8 open Dependabot alerts">
